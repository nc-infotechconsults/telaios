line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async best-practices
    "TID",           # tidy imports
    "PT",            # pytest style
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI relies on `Depends()` in defaults
]

[lint.per-file-ignores]
"tests/**/*.py" = ["B", "N802", "N803"]

[lint.isort]
known-first-party = ["telaios"]

[format]
quote-style = "double"
