[project]
name = "telaios-server"
version = "0.1.0"
description = "Telaios monolith server (FastAPI). Merges legacy data-api + agent-service."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nico Cardone" }]
license = { text = "MIT" }

# Phase 0 baseline: minimal runtime deps to scaffold the app.
# Heavy domain deps (LangChain/LangGraph, neo4j, openai, voyageai, etc.) are added in later phases
# when their modules land. See PLAN-MIGRATION.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-multipart>=0.0.28",
    "kubernetes>=35.0.0",
    "fastembed>=0.8.0",
    # Qdrant — vector store for RAG pipelines
    # Source: https://qdrant.tech/documentation/
    "qdrant-client>=1.14",
    # LangChain Qdrant integration
    # Source: https://python.langchain.com/docs/integrations/vectorstores/qdrant
    "langchain-qdrant>=0.2",
    "ocrmac>=1.0.1"
]

[project.optional-dependencies]
docker = [
    "docker>=7.1",
]
k8s = [
    "kubernetes>=31.0",
]
agents = [
    "langchain>=1.3.1",
    "langchain-openai>=1.2.1",
    "langchain-anthropic>=1.4.3",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
]
documents = [
    "docling>=2.5",

]
storage = [
    "aioboto3>=15.5.0",
]
graph = [
    "neo4j>=5.0",
    "falkordb>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-redis",
    # TUI eval CLI
    "textual>=1.0",
    "vllm-mlx>=0.3.0",
    "mlx-optiq>=0.0.10"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
telaios-eval = "telaios.cli.app:main"
telaios-planner = "telaios.cli.planner_tui:main"
telaios-api = "telaios.main:app"
serve-llm = "telaios.cli.serve_llm:main"

[tool.uv.scripts]
# Kept as alias for uv installations that support [tool.uv.scripts].
# Homebrew uv users: use "uv run serve-llm" via the [project.scripts] entry point above.
serve-llm = "vllm-mlx serve mlx-community/Qwen3.5-9B-MLX-4bit --port 8000 --continuous-batching --enable-prefix-cache --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen --max-tokens 16384"

[tool.hatch.build.targets.wheel]
packages = ["src/telaios"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require external services (postgres, redis)",
    "live: tests that call real LLM APIs (requires LIVE_LLM_TESTS=1 and a valid API key)",
    "requires_qdrant: tests that require a running Qdrant instance",
]
