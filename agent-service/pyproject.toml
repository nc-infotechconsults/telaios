[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telaios"]

[project]
name = "agent-service"
version = "1.0.0"
description = "TelaiOS — Agent Service (Python)"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    # Settings / validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.3.0",
    # HTTP client
    "httpx>=0.27.0",
    # Redis
    "redis>=5.0.0",
    # LangChain / LangGraph
    "langchain>=1.0.0",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.2.0",
    "langgraph>=1.1.0",
    "langchain-anthropic>=1.2.0",
    "langchain-community>=0.4.1",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    # Document extraction
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # Embeddings
    "fastembed>=0.4.0",
    "langchain-voyageai>=0.3.0",
    # S3 (MinIO)
    "aioboto3>=13.0.0",
    # Git
    "gitpython>=3.1.40",
    # Crypto
    "cryptography>=42.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]
documents = [
    "unstructured[all-docs]>=0.12.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "extract-msg>=0.50.0",
    "tiktoken>=0.5.0",
]
rag = [
    "rank-bm25>=0.2.2",
]
skills = [
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-service = "telaios.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
