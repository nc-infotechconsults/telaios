name: Bug Report
description: Report a bug or unexpected behaviour in TelaiOS
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Paste any relevant logs, stack traces, or screenshots.
      render: shell

  - type: dropdown
    id: service
    attributes:
      label: Which service is affected?
      multiple: true
      options:
        - Frontend
        - Data API
        - Agent Service
        - Infrastructure (Docker / Postgres / Redis / MinIO)
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide relevant version information.
      value: |
        - OS:
        - Browser (if frontend):
        - Node version (`node --version`):
        - npm version (`npm --version`):
        - Python version (`python --version`):
        - Docker Compose version (`docker compose version`):
        - LLM provider / model:
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported before.
          required: true
        - label: I am using the latest version from `main`.
          required: false
