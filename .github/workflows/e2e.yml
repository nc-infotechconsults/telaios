# ──────────────────────────────────────────────────────────────
# E2E Tests — TelaiOS
#
# Spins up the full platform (Postgres, Redis, MinIO, FastAPI server,
# Vite frontend) and runs:
#   1. API smoke / integration tests  (tests/smoke.test.js)
#   2. Playwright browser E2E tests   (frontend/e2e/)
#      – frontend runs against the real server (no demo mode)
# ──────────────────────────────────────────────────────────────
name: E2E Tests

on:
  push:
    branches: [test-ci]
  pull_request:
    branches: [test-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment for every step ─────────────────────────
env:
  DATABASE_URL: postgres://sweai:sweai@localhost:5432/sweai
  ENCRYPTION_KEY: test_encryption_key_32_chars_xx
  INTERNAL_API_KEY: test-internal-api-key
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: sweai
  S3_SECRET_KEY: sweai-secret
  S3_BUCKET: sweai-documents
  S3_REGION: us-east-1
  SERVER_URL: http://localhost:8000
  REDIS_URL: redis://localhost:6379
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
  LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout & tooling ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      # ── Infrastructure ────────────────────────────────────────
      - name: Start infrastructure (Postgres, Redis, MinIO)
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # ── Dependencies ──────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install smoke test dependencies
        working-directory: tests
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python 3.14
        working-directory: server
        run: uv python install 3.14

      - name: Install server dependencies
        working-directory: server
        run: uv sync --all-extras

      # ── Database ──────────────────────────────────────────────
      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://sweai:sweai@localhost:5432/sweai
        run: uv run alembic upgrade head

      # ── Start application services ────────────────────────────
      - name: Start server (Python / uvicorn)
        env:
          PORT: "8000"
          DATABASE_URL: postgresql+asyncpg://sweai:sweai@localhost:5432/sweai
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
        run: |
          cd server && uv run uvicorn telaios.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for server on :8000 ..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'
          echo "✓ server ready"

      # ── Configure LLM settings in the DB ─────────────────────
      - name: Store LLM credentials in platform settings
        if: ${{ env.LLM_API_KEY != '' }}
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-admin@telaios.local","password":"CiAdmin1234!","display_name":"CI Admin"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -X PATCH http://localhost:8000/settings \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"llm_provider\":\"$LLM_PROVIDER\",\"llm_model\":\"$LLM_MODEL\",\"llm_api_key_raw\":\"$LLM_API_KEY\"}"

      # ── API smoke / integration tests ─────────────────────────
      - name: Run smoke tests
        env:
          SERVER_URL: http://localhost:8000
          VERBOSE: "1"
        working-directory: tests
        run: npm test

      # ── Playwright browser E2E tests ──────────────────────────
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (real backend, no demo mode)
        working-directory: frontend
        env:
          SERVER_URL: http://localhost:8000
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
        run: npm run test:e2e

      # ── Artifacts ─────────────────────────────────────────────
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/server.log
          retention-days: 7

      # ── Cleanup ───────────────────────────────────────────────
      - name: Stop services
        if: always()
        run: |
          kill "$SERVER_PID" 2>/dev/null || true
          docker compose -f docker-compose.dev.yml down 2>/dev/null || true
