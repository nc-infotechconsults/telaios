# ──────────────────────────────────────────────────────────────
# E2E Tests — SWE AI Platform
#
# Spins up the full platform (Postgres, Redis, MinIO, data-api,
# agent-service, Vite frontend) and runs:
#   1. API smoke / integration tests  (tests/smoke.test.js)
#      – including an LLM connectivity check via LLM_API_KEY secret
#   2. Playwright browser E2E tests   (frontend/e2e/)
#      – frontend runs against the real backend (no demo mode)
# ──────────────────────────────────────────────────────────────
name: E2E Tests

on:
  push:
    branches: [main, test-ci]
  pull_request:
    branches: [main, test-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment for every step ─────────────────────────
env:
  DATABASE_URL: postgres://sweai:sweai@localhost:5432/sweai
  ENCRYPTION_KEY: test_encryption_key_32_chars_xx
  INTERNAL_API_KEY: test-internal-api-key
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: sweai
  S3_SECRET_KEY: sweai-secret
  S3_BUCKET: sweai-documents
  S3_REGION: us-east-1
  AGENT_SERVICE_URL: http://localhost:8000
  DATA_API_URL: http://localhost:3000
  DATA_API_KEY: test-internal-api-key
  REDIS_URL: redis://localhost:6379
  EMBEDDING_MODEL: text-embedding-3-small
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
  LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout & tooling ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      # ── Infrastructure ────────────────────────────────────────
      - name: Start infrastructure (Postgres, Redis, MinIO)
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # ── Dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Database ──────────────────────────────────────────────
      - name: Run database migrations
        working-directory: data-api
        run: bun run migration:run

      # ── Start application services ────────────────────────────
      - name: Start data-api
        env:
          PORT: "3000"
        run: |
          cd data-api && bun run start > /tmp/data-api.log 2>&1 &
          echo "DATA_API_PID=$!" >> "$GITHUB_ENV"

      - name: Start agent-service
        env:
          PORT: "8000"
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
        run: |
          cd agent-service && bun run start > /tmp/agent-service.log 2>&1 &
          echo "AGENT_SERVICE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for data-api on :3000 ..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 2; done'
          echo "✓ data-api ready"

          echo "Waiting for agent-service on :8000 ..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'
          echo "✓ agent-service ready"

      # ── Configure LLM settings in the DB ─────────────────────
      - name: Store LLM credentials in platform settings
        if: ${{ env.LLM_API_KEY != '' }}
        run: |
          curl -sf -X PATCH http://localhost:3000/settings \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $INTERNAL_API_KEY" \
            -d "{\"llm_provider\":\"$LLM_PROVIDER\",\"llm_model\":\"$LLM_MODEL\",\"llm_api_key_raw\":\"$LLM_API_KEY\"}"

      # ── API smoke / integration tests ─────────────────────────
      - name: Run smoke tests (including LLM connectivity)
        env:
          AGENT_URL: http://localhost:8000
          VERBOSE: "1"
        run: bun run test

      # ── Playwright browser E2E tests ──────────────────────────
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (real backend, no demo mode)
        working-directory: frontend
        env:
          DATA_API_URL: http://localhost:3000
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
        run: bun run test:e2e

      # ── Artifacts ─────────────────────────────────────────────
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/data-api.log
            /tmp/agent-service.log
          retention-days: 7

      # ── Cleanup ───────────────────────────────────────────────
      - name: Stop services
        if: always()
        run: |
          kill "$DATA_API_PID" 2>/dev/null || true
          kill "$AGENT_SERVICE_PID" 2>/dev/null || true
          docker compose -f docker-compose.dev.yml down 2>/dev/null || true
