name: server-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: lint (ruff + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import-linter
        run: uv run lint-imports

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Mypy
        run: uv run mypy src/telaios

  # `test` job intentionally omitted in Phase 0 (only smoke tests, no DB yet).
  # Phase 1+ adds testcontainers-backed integration test job here.
