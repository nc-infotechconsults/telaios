name: server-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: lint (ruff + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import-linter
        run: uv run lint-imports

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Mypy
        run: uv run mypy src/telaios

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: telaios
          POSTGRES_PASSWORD: telaios
          POSTGRES_DB: telaios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telaios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://telaios:telaios@localhost:5432/telaios_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pytest
        run: uv run pytest --tb=short -q

  slim-profiles:
    name: slim profile / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: api-core
            modules: users,workspaces,projects,repositories,environments,settings,library,agent_profiles,health
          - profile: api-chat
            modules: users,workspaces,projects,repositories,environments,settings,library,agent_profiles,plans,tasks,messages,chat,health
          - profile: api-documents
            modules: users,workspaces,projects,repositories,environments,settings,library,agent_profiles,documents,document_extraction,document_copilot,skills,health
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Boot slim profile and check /health
        env:
          TELAIOS_MODULES: ${{ matrix.modules }}
          # Minimal env — no real DB/Redis needed for a cold boot /health check
          DATABASE_URL: postgresql+asyncpg://telaios:telaios@localhost:5432/telaios
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret
          INTERNAL_API_KEY: ci-internal-key
        run: |
          uv run uvicorn telaios.main:app --port 8000 &
          SERVER_PID=$!
          # Wait up to 15 s for the server to accept connections
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          kill $SERVER_PID
