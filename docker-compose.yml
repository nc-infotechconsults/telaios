services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sweai
      POSTGRES_USER: sweai
      POSTGRES_PASSWORD: sweai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sweai}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sweai-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-api:
    build:
      context: .
      dockerfile: data-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sweai:sweai@postgres:5432/sweai
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sweai}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sweai-secret}
      S3_BUCKET: ${S3_BUCKET:-sweai-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      AGENT_SERVICE_URL: http://agent-service:8000
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./data-api:/app/data-api
      - /app/node_modules
      - /app/data-api/node_modules

  agent-service:
    build:
      context: ./agent-service-py
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_API_URL: http://data-api:3000
      DATA_API_KEY: ${INTERNAL_API_KEY:-internal-change-me}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sweai}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sweai-secret}
      S3_BUCKET: ${S3_BUCKET:-sweai-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      WORKSPACES_ROOT: /workspaces
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy
      data-api:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - agent_workspaces:/workspaces

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_DATA_API_URL: http://localhost:3000
      VITE_AGENT_SERVICE_URL: http://localhost:8000
      INTERNAL_DATA_API_URL: http://data-api:3000
      INTERNAL_AGENT_SERVICE_URL: http://agent-service:8000
    depends_on:
      - data-api
      - agent-service
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
      - /app/frontend/node_modules

volumes:
  postgres_data:
  agent_workspaces:
  minio_data:
