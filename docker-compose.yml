services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sweai
      POSTGRES_USER: sweai
      POSTGRES_PASSWORD: sweai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sweai}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sweai-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://sweai:sweai@postgres:5432/sweai
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sweai}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sweai-secret}
      S3_BUCKET: ${S3_BUCKET:-sweai-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      WORKSPACES_ROOT: /workspaces
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@telaios.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    # Run Alembic migrations before starting the API server.
    command: >-
      sh -c "alembic upgrade head && uvicorn telaios.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - server_workspaces:/workspaces
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - server

volumes:
  postgres_data:
  minio_data:
  server_workspaces:
